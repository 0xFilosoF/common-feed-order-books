[package]
name = "feed-order-books"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "feed-order-books"

[dependencies]
anyhow = "1"
config = { version = "0.15", default-features = false, features = ["yaml"] }
dotenvy = "0.15"
fastrand = "2"
futures-util = { version = "0.3", features = ["sink"] }
kanal = "0.1.1"
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
manual_let_else = "warn"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"
used_underscore_binding = "deny"

[profile.release]
lto = true
codegen-units = 1
